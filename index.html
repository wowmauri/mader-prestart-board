<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADER | GPS Prestart Board</title>
    <style>
        /* [Keeping the same professional styling from the previous draft for consistency] */
        :root { --mader-yellow: #fbbf24; --mader-dark: #1e293b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; color: #334155; padding-bottom: 50px; }
        .header { background: var(--mader-dark); color: white; padding: 1.5rem; text-align: center; border-bottom: 6px solid var(--mader-yellow); }
        .main-content { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .glass-card { background: white; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
        .card-title { padding: 12px; background: var(--mader-yellow); color: var(--mader-dark); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; }
        .card-body { padding: 15px; }

        .gps-status { font-size: 0.75rem; margin-top: 8px; color: #64748b; font-style: italic; }
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .weather-stat { background: #f1f5f9; padding: 15px; border-radius: 8px; text-align: center; }
        .weather-stat b { display: block; font-size: 1.2rem; color: var(--mader-dark); }

        .btn-gps { background: var(--mader-dark); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 10px; }
        .btn-gps:hover { background: #334155; }
        
        /* Task Row Styling */
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f1f5f9; padding: 12px; text-align: left; font-size: 0.75rem; color: #64748b; }
        td { border-bottom: 1px solid var(--border); padding: 10px; }
        textarea { width: 100%; border: 1px solid #e2e8f0; border-radius: 4px; padding: 8px; }
    </style>
</head>
<body>

    <header class="header">
        <h1>MADER Prestart</h1>
        <p id="dateLine"></p>
    </header>

    <div class="main-content">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            
            <div class="glass-card">
                <div class="card-title">Shift Tasks</div>
                <table>
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>Location</th>
                            <th>Task</th>
                        </tr>
                    </thead>
                    <tbody id="taskBody">
                        <tr>
                            <td><textarea rows="2">Josh / Mau</textarea></td>
                            <td><textarea rows="2" id="gps-asset-loc">Detecting...</textarea></td>
                            <td><textarea rows="2">Panels</textarea></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="glass-card">
                <div class="card-title">Site Environment</div>
                <div class="card-body">
                    <button class="btn-gps" onclick="getLocation()">📍 Sync GPS & Weather</button>
                    <div id="gps-info" class="gps-status">Click to fetch current site data...</div>
                    
                    <div class="weather-grid">
                        <div class="weather-stat">
                            <small>Temp</small>
                            <b id="temp-val">--°</b>
                        </div>
                        <div class="weather-stat">
                            <small>Wind</small>
                            <b id="wind-val">-- kph</b>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('dateLine').innerText = new Date().toDateString();

        async function getLocation() {
            const status = document.getElementById('gps-info');
            const assetField = document.getElementById('gps-asset-loc');

            if (!navigator.geolocation) {
                status.innerText = "Geolocation not supported by browser.";
                return;
            }

            status.innerText = "🛰️ Locating site...";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // 1. Fetch Location Name (Reverse Geocode)
                try {
                    const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                    const geoData = await geoRes.json();
                    const locationName = geoData.locality || geoData.city || "Remote Site";
                    
                    status.innerText = `✅ Located: ${locationName}`;
                    assetField.value = `${locationName} (Lat: ${lat.toFixed(2)})`;

                    // 2. Fetch Weather based on GPS
                    fetchWeather(lat, lon);
                } catch (err) {
                    status.innerText = "⚠️ Location found, but name lookup failed.";
                    fetchWeather(lat, lon);
                }
            }, () => {
                status.innerText = "❌ GPS Access Denied.";
            });
        }

        async function fetchWeather(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                
                document.getElementById('temp-val').innerText = Math.round(data.current_weather.temperature) + "°C";
                document.getElementById('wind-val').innerText = Math.round(data.current_weather.windspeed) + " kph";
            } catch (err) {
                console.error("Weather fetch failed");
            }
        }

        // Auto-load on start
        window.onload = getLocation;
    </script>
</body>
</html>
